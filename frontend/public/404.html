<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirect</title>
    <script type="text/javascript">
      // Redirect 404s to root with the original path preserved in sessionStorage
      // so React Router can handle the route correctly
      sessionStorage.setItem("redirectTo", window.location.pathname);
      window.location.replace("/Vision/");
    </script>
  </head>
</html>
